name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  media:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r media-test-requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          CSL_RUN_MEDIA_TESTS: '1'
          # Generated fixtures are trusted; hosted runner namespace support varies.
          CSL_MEDIA_SANDBOX: process
